<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5 text-center">
    <div class="card p-5 shadow-sm border-0 mx-auto" style="max-width: 600px;">
        <h1 class="text-success mb-3">Order Placed!</h1>
        <p class="lead">Thank you for shopping with LuxeBags Boutique.</p>
        <p>Your order reference is <strong>#{{ order.id }}</strong>.</p>
        <a href="{% url 'shop:product_list' %}" class="btn btn-dark mt-3">Continue Shopping</a>
    </div>
</div>
</body>
</html>
