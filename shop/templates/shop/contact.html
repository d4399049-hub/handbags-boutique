<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - LuxeBags Boutique</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .nav-brand-title { font-weight: 700; letter-spacing: 0.5px; }
        .nav-link { font-weight: 500; transition: color 0.2s ease; }
        .nav-link:hover { color: #f8d7da !important; }
    </style>
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2 nav-brand-title" href="{% url 'shop:product_list' %}">
            LuxeBags Boutique
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-3">
                <li class="nav-item">
                    <a class="nav-link text-white" href="{% url 'shop:product_list' %}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white active" href="{% url 'shop:contact_us' %}">Contact Us</a>
                </li>
                <li class="nav-item">
                    <a class="btn btn-outline-light btn-sm px-3" href="{% url 'cart:cart_detail' %}">Shopping Bag</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Contact Form Section -->
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow-sm border-0 p-4">
                <h3 class="fw-bold mb-3">Get in Touch</h3>
                <p class="text-muted mb-4">Have questions about our bags or orders? Send us a message below.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Name</label>
                        <input type="text" class="form-control" placeholder="Your name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email</label>
                        <input type="email" class="form-control" placeholder="name@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Message</label>
                        <textarea class="form-control" rows="4" placeholder="How can we help you?" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-dark w-100 py-2">Submit</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
