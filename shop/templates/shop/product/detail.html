<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <a href="{% url 'shop:product_list' %}" class="btn btn-outline-secondary mb-4">&larr; Back to Shop</a>
    <div class="card shadow-sm p-4">
        <h2>{{ product.name }}</h2>
        <h4 class="text-success mt-2">${{ product.price }}</h4>
        <p class="mt-3 text-secondary">{{ product.description|linebreaks }}</p>
        <form action="{% url 'cart:cart_add' product.id %}" method="post" class="mt-3">
    {% csrf_token %}
    <button type="submit" class="btn btn-success btn-lg">Add to Cart</button>
</form>
    </div>
</div>
</body>
</html>
